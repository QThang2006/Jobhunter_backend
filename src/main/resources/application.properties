spring.application.name=jobhunter

#config database
###
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
###

###
#Config Jwt

jwt.base64-secret=${JWT_BASE64_SECRET}

jwt.access-token-validity-in-seconds=8640000
jwt.refresh-token-validity-in-seconds=8640000

#config upload file
###
#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB

#base path
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
###

###
#config pagination
#start page = 1 not 0
spring.data.web.pageable.one-indexed-parameters=true

###
#config email with gmail
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

##
# Google OAuth2 Configuration
# Lấy từ: https://console.cloud.google.com/ -> APIs & Services -> Credentials
# Authorized redirect URIs: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile


##
# n8n Webhook Configuration (Google Meet Interview Automation)
n8n.webhook.interview-meet-url=${N8N_INTERVIEW_MEET_WEBHOOK}

app.frontend-url=${FRONTEND_URL:https://jobhunter-fe-one.vercel.app}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://jobhunter-fe-one.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
abstract.api-key=${ABSTRACT_API_KEY:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
