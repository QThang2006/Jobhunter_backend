<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bản tin Việc làm Ngành Bánh - BakeJobs</title>
</head>

<body style="margin:0; padding:0; background-color:#fdfaf6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fdfaf6; padding:30px 0;">
    <tr>
        <td align="center">
            <!-- MAIN CONTAINER -->
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-radius:12px; padding:30px; border:1px solid #f0e6d6; box-shadow:0 4px 12px rgba(135,56,0,0.06);">

                <!-- HEADER -->
                <tr>
                    <td>
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="left" style="font-size:22px; font-weight:bold; color:#873800;">
                                    🥐 BakeJobs
                                </td>
                                <td align="right" style="font-size:14px; color:#d46b08; font-weight:600;">
                                    Cơ hội việc làm mới nhất
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- LINE -->
                <tr>
                    <td style="padding:15px 0;">
                        <div style="border-top:2px solid #ffd591;"></div>
                    </td>
                </tr>

                <!-- GREETING -->
                <tr>
                    <td style="font-size:15px; color:#333333; line-height:24px;">
                        Xin chào <strong th:text="${name}" style="color:#873800;">Ứng viên</strong>,
                        <br><br>
                        Hệ thống các Tiệm Bánh đối tác vừa đăng tuyển các vị trí mới phù hợp với kỹ năng và ca làm việc bạn đang quan tâm:
                    </td>
                </tr>

                <!-- SPACE -->
                <tr>
                    <td style="padding-top:20px;"></td>
                </tr>

                <!-- JOB LIST -->
                <tr>
                    <td>
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr th:each="job : ${jobs}">
                                <td style="padding-bottom:22px;">
                                    <!-- JOB NAME -->
                                    <div style="margin-bottom:6px;">
                                        <a th:href="@{https://jobhunter-fe-one.vercel.app/job/open-to-email(id=${job.id})}"
                                           target="_blank"
                                           th:text="${job.name}"
                                           style="font-size:17px; font-weight:bold; color:#873800; text-decoration:none;">
                                        </a>
                                    </div>

                                    <!-- COMPANY & LOCATION -->
                                    <div style="font-size:14px; color:#666666; margin-bottom:6px;">
                                        🏪 <span th:text="${job.company.name}"></span>
                                    </div>

                                    <!-- SALARY -->
                                    <div style="font-size:15px; color:#d46b08; font-weight:bold; margin-bottom:8px;">
                                        💰 <span th:text="${#numbers.formatDecimal(job.salary, 0, 'COMMA', 0, 'POINT')}"></span> đ
                                    </div>

                                    <!-- SKILLS -->
                                    <div style="margin-bottom:12px;">
                                        <span th:each="skill : ${job.skills}"
                                              th:text="${skill.name}"
                                              style="display:inline-block; background-color:#fff7e6; border:1px solid #ffd591; border-radius:4px; padding:3px 8px; font-size:12px; color:#d46b08; margin-right:5px; margin-bottom:5px;">
                                        </span>
                                    </div>

                                    <!-- DIVIDER -->
                                    <div style="border-top:1px dashed #eedccb;"></div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- BUTTON -->
                <tr>
                    <td align="center" style="padding-top:15px;">
                        <a href="https://jobhunter-fe-one.vercel.app/job"
                           target="_blank"
                           style="display:block; background-color:#d46b08; color:#ffffff; text-decoration:none; font-size:15px; font-weight:bold; line-height:46px; border-radius:24px; width:100%; max-width:280px; box-shadow:0 2px 6px rgba(212,107,8,0.3);">
                            🥐 Xem tất cả việc làm ngành Bánh
                        </a>
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="padding-top:30px; font-size:14px; color:#666666; line-height:22px; border-top:1px solid #f0e6d6; margin-top:20px;">
                        Chúc bạn tìm được ca làm việc như ý!<br>
                        <strong style="color:#873800;">Đội ngũ BakeJobs</strong>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
